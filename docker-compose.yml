name: ai-data-analyst

# Both services run the same image and import the same `core` package. The UI runs
# the engine in-process (no HTTP hop for DataFrames); the API is there for
# programmatic access. Because sessions are held in memory, each service keeps its
# own — documented in the README under Known limitations.

services:
  ui:
    build:
      context: .
      target: runtime
    image: ai-data-analyst:latest
    container_name: analyst-ui
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      LOG_JSON: "true"
    volumes:
      # Read-only: the app never writes to the datasets.
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  api:
    build:
      context: .
      target: runtime
    image: ai-data-analyst:latest
    container_name: analyst-api
    command:
      - uvicorn
      - api.main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=1          # sessions live in-process; more workers would split them
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LOG_JSON: "true"
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
