[pytest]
testpaths = tests
python_files = test_*.py
addopts = --strict-markers --tb=short
# /app is root-owned in the container while the process runs as a non-root user,
# so the default in-tree cache directory is not writable. Point it at /tmp, which
# is writable everywhere and is throwaway state anyway.
cache_dir = /tmp/.pytest_cache
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
